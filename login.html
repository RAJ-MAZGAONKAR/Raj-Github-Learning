<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Demo Login</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ...existing code... -->
  <!-- background bubbles -->
  <div class="bg">
    <span class="bubble" style="--size:120px;--left:5%;--delay:0s;--dur:16s;--color:rgba(255,205,86,0.20)"></span>
    <span class="bubble" style="--size:80px;--left:20%;--delay:2s;--dur:14s;--color:rgba(128,0,0,0.16)"></span>
    <span class="bubble" style="--size:40px;--left:35%;--delay:4s;--dur:12s;--color:rgba(220,53,69,0.14)"></span>
    <span class="bubble" style="--size:160px;--left:55%;--delay:1s;--dur:20s;--color:rgba(255,240,200,0.18)"></span>
    <span class="bubble" style="--size:90px;--left:75%;--delay:3s;--dur:18s;--color:rgba(128,0,0,0.12)"></span>
    <span class="bubble" style="--size:60px;--left:88%;--delay:5s;--dur:13s;--color:rgba(220,53,69,0.10)"></span>
  </div>

  <main class="center">
    <form id="loginForm" class="login-card" novalidate>
      <h1>Sign in</h1>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <div class="pw-wrap">
        <input id="password" name="password" type="password" placeholder="••••••••" required minlength="6" />
        <button type="button" id="togglePw" aria-label="Show password">Show</button>
      </div>

      <div class="row">
        <label class="small">
          <input id="remember" name="remember" type="checkbox" /> Remember me
        </label>
        <a class="small" href="#" tabindex="-1">Forgot?</a>
      </div>

      <div id="error" role="alert" aria-live="polite"></div>

      <button type="submit" class="primary">Sign in</button>
    </form>
  </main>

  <script src="js/script.js" defer></script>
</body>
</html>
